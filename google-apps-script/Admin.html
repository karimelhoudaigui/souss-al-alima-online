<!doctype html>
<html lang="fr">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body { margin: 0; padding: 24px; background: #fbf8f2; color: #35261f; font-family: Georgia, "Times New Roman", serif; }
      main { max-width: 620px; margin: 30px auto; padding: 24px; border-block: 1px solid #d9cabc; background: #fffdf8; }
      h1 { font-weight: 400; }
      label { display: block; margin: 18px 0; font-size: 14px; }
      input { display: block; width: 100%; box-sizing: border-box; margin-top: 8px; padding: 12px; border: 1px solid #d9cabc; font: inherit; }
      button { min-height: 44px; padding: 10px 18px; border: 0; background: #784638; color: white; font: inherit; cursor: pointer; }
      button:disabled { opacity: .6; }
      .notice { min-height: 24px; line-height: 1.6; overflow-wrap: anywhere; }
      .error { color: #8b3028; }
      .success { color: #315b32; }
      .warning { font: 13px/1.6 Arial, sans-serif; color: #655a52; }
    </style>
  </head>
  <body>
    <main>
      <p>معهد سوس العالمة</p>
      <h1>Administration des comptes élèves</h1>
      <p class="warning">Cette page nécessite le code administrateur confidentiel. Ne le transmettez jamais à un élève et ne le saisissez pas sur un appareil partagé.</p>
      <form id="form">
        <label>Nom affiché dans le planning
          <input name="name" required minlength="2" maxlength="80" autocomplete="off">
        </label>
        <label>Code administrateur
          <input name="adminKey" required minlength="64" maxlength="64" autocomplete="off">
        </label>
        <button type="submit">Créer le compte</button>
      </form>
      <p id="notice" class="notice" role="status"></p>
    </main>
    <script>
      const form = document.getElementById("form");
      const notice = document.getElementById("notice");
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const button = form.querySelector("button");
        const data = new FormData(form);
        button.disabled = true;
        notice.className = "notice";
        notice.textContent = "Création du compte…";
        google.script.run
          .withSuccessHandler((result) => {
            button.disabled = false;
            notice.className = "notice success";
            notice.textContent = `Compte créé pour ${result.name}. Code personnel à transmettre en privé une seule fois : ${result.pin}`;
            form.elements.adminKey.value = "";
            form.elements.name.value = "";
          })
          .withFailureHandler((error) => {
            button.disabled = false;
            notice.className = "notice error";
            notice.textContent = error.message || "La création a échoué.";
          })
          .adminAddStudent(data.get("name"), data.get("adminKey"));
      });
    </script>
  </body>
</html>
